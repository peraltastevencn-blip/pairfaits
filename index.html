<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pairfaits · Arma tu parfait</title>
<style>
:root{--bg:#fff6ee;--card:#ffffff;--ink:#3b2530;--mute:#8a6f78;--accent:#e0457b;--accent2:#ffb347;--line:#f1d9d9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1318;--card:#2a1c23;--ink:#fbeef0;--mute:#c3a5ae;--accent:#ff6b9d;--accent2:#ffc067;--line:#432c37;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1318;--card:#2a1c23;--ink:#fbeef0;--mute:#c3a5ae;--accent:#ff6b9d;--accent2:#ffc067;--line:#432c37;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:20px 18px 40px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px;min-height:34px}
.bar{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.lvl{font:600 12px system-ui,sans-serif;color:var(--mute);white-space:nowrap}
.brand{display:inline-block;font:700 13px system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);background:var(--card);border:2px solid var(--line);padding:6px 14px;border-radius:99px;margin-bottom:10px}
.back{border:0;background:none;color:var(--mute);font-size:22px;padding:4px 8px;cursor:pointer}
.scene{animation:in .45s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.emoji{font-size:54px;display:block;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
h1{font-size:30px;line-height:1.15;margin:8px 0 8px}
p.sub{font:16px/1.5 system-ui,sans-serif;color:var(--mute);margin:0 0 22px}
input[type=text]{width:100%;font:18px system-ui,sans-serif;padding:16px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);outline:0;transition:border .2s}
input:focus{border-color:var(--accent)}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:16px;border-radius:20px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-family:inherit;transition:transform .15s,border .2s,box-shadow .2s}
.opt:active{transform:scale(.97)}
.opt .e{font-size:38px}
.opt b{display:block;font-size:19px}
.opt span.d{display:block;font:14px/1.4 system-ui,sans-serif;color:var(--mute);margin-top:2px}
.opt.sel{border-color:var(--accent);box-shadow:0 8px 22px -10px var(--accent);transform:scale(1.02)}
.opt .chk{margin-left:auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:700 14px system-ui;color:#fff;flex:none}
.opt.sel .chk{background:var(--accent);border-color:var(--accent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cta{width:100%;margin-top:22px;padding:17px;border:0;border-radius:99px;font:700 18px system-ui,sans-serif;color:#fff;background:linear-gradient(90deg,var(--accent),#f0705a);cursor:pointer;box-shadow:0 10px 24px -10px var(--accent);transition:transform .15s,opacity .2s;display:block;text-align:center;text-decoration:none}
.cta:active{transform:scale(.97)}
.cta[disabled]{opacity:.4;pointer-events:none}
.ghost{background:none;color:var(--accent);box-shadow:none;border:2px solid var(--accent);margin-top:12px}
.count{font:600 13px system-ui;color:var(--accent);margin:12px 0 0;text-align:center;min-height:18px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:99px;font:600 14px system-ui;transition:transform .5s cubic-bezier(.2,1.4,.4,1);z-index:9;max-width:92vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.sum{background:var(--card);border:2px dashed var(--line);border-radius:22px;padding:6px 18px;margin-bottom:6px}
.sum div{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font:16px system-ui,sans-serif}
.sum div:last-child{border:0}.sum em{font-style:normal;font-size:26px}.sum small{display:block;color:var(--mute);font-size:12px}
.badges{display:flex;gap:8px;justify-content:center;margin:14px 0;font-size:26px}
.nope{margin-top:16px;padding:14px 16px;border-radius:16px;background:var(--card);border:2px dashed var(--accent);font:14px/1.5 system-ui,sans-serif;color:var(--ink);animation:in .4s}
.note{font:13px/1.5 system-ui,sans-serif;color:var(--mute);text-align:center;margin-top:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><button class="back" id="back" aria-label="Volver" style="visibility:hidden">‹</button><div class="bar"><i id="fill"></i></div><span class="lvl" id="lvl"></span></div>
  <main id="app"></main>
</div>
<div class="toast" id="toast"></div>
<script>
// Endpoint que envía el pedido a tu Telegram (api/pedido.js)
var ENDPOINT = "/api/pedido";
var TELEGRAM_USER = "TU_USUARIO_DE_TELEGRAM";

var S = {name:"", asiste:null, yogur:"", cereal:"", frutas:[]};
var step = 0, TOTAL = 6;
var app = document.getElementById("app");

var DATA = {
  yogur:{e:"🥛",t:"Nivel 1 · El abrazo cremoso",s:"Cierra los ojos: la primera cucharada empieza aquí. Elige la base que te envuelve como una nube.",cta:"Siguiente capa",badge:"🏅 Logro desbloqueado: Maestro de la Cremosidad",
    o:[["Yogurt Griego","🥛","Espeso, sedoso y con un toque ácido que despierta el paladar."],["Kéfir","🫙","Fresco, vivo y apenas burbujeante: cada cucharada cosquillea."]]},
  cereal:{e:"🥣",t:"Nivel 2 · El crujido dorado",s:"Escucha ese crac. El crunch convierte cada bocado en algo que no vas a olvidar.",cta:"Quiero la fruta",badge:"🏅 Logro desbloqueado: Domador del Crunch",
    o:[["Avena","🌾","Tierna y tostadita, con aroma a hogar y a mañana tranquila."],["Granola","🍯","Miel, nueces y mucho crunch: dorada, crujiente y adictiva."]]},
  frutas:{e:"🍓",t:"Nivel 3 · Estallido de frescura",s:"La capa más jugosa. Elige exactamente 2 frutas y pinta tu parfait de color.",cta:"Ver mi creación",badge:"🏅 Logro desbloqueado: Alquimista de Frutas",
    o:[["Kiwi","🥝","Verde brillante, jugoso y con una chispa ácida que pellizca la lengua."],["Mango","🥭","Dorado, dulce y tropical: sabe a vacaciones."],["Fresa","🍓","Roja, fragante y jugosa: el antojo que nunca falla."]]}
};

function esc(x){return String(x).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2400)}
function go(n){step=n;render();window.scrollTo({top:0,behavior:"smooth"})}

function msg(){
  return "🍓 ¡Nuevo pedido de parfait!\n\n👤 Cliente: "+S.name+"\n🥛 Yogurt: "+S.yogur+"\n🥣 Cereal: "+S.cereal+"\n🍓 Fruta: "+S.frutas.join(" y ");
}
function link(){return "https://t.me/"+encodeURIComponent(TELEGRAM_USER)+"?text="+encodeURIComponent(msg())}

function levelView(key,multi){
  var d=DATA[key],h='<div class="scene"><span class="emoji">'+d.e+'</span><h1>'+d.t+'</h1><p class="sub">'+d.s+'</p><div class="opts">';
  d.o.forEach(function(o){
    var sel=multi?S.frutas.indexOf(o[0])>-1:S[key]===o[0];
    h+='<button class="opt'+(sel?' sel':'')+'" data-v="'+o[0]+'"><span class="e">'+o[1]+'</span><span><b>'+o[0]+'</b><span class="d">'+o[2]+'</span></span><span class="chk">'+(sel?'✓':'')+'</span></button>';
  });
  h+='</div>'+(multi?'<div class="count" id="cnt"></div>':'')+'<button class="cta" id="next" disabled>'+d.cta+'</button></div>';
  return h;
}

function render(){
  document.getElementById("fill").style.width=Math.round(step/(TOTAL-1)*100)+"%";
  document.getElementById("back").style.visibility=step>0?"visible":"hidden";
  var L={2:"Nivel 1/3",3:"Nivel 2/3",4:"Nivel 3/3",5:"¡Listo!"};
  document.getElementById("lvl").textContent=L[step]||"Bienvenida";
  var nx;
  if(step===0){
    app.innerHTML='<div class="scene"><span class="brand">Pairfaits</span><span class="emoji">🍓</span><h1>Hoy el chef eres tú</h1><p class="sub">Tres capas, tres decisiones y un antojo que nace de tus manos. Empecemos: ¿cómo te llamas, chef?</p><input type="text" id="nm" placeholder="Tu nombre, chef" autocomplete="given-name" maxlength="40" value="'+esc(S.name)+'"><button class="cta" id="next">Empezar mi creación</button></div>';
    var nm=document.getElementById("nm");nx=document.getElementById("next");
    var chk=function(){nx.disabled=nm.value.trim().length<2};chk();
    nm.addEventListener("input",chk);
    nx.onclick=function(){S.name=nm.value.trim();go(1)};
    nm.addEventListener("keydown",function(e){if(e.key==="Enter"&&!nx.disabled)nx.click()});
  }else if(step===1){
    app.innerHTML='<div class="scene"><span class="emoji">🎉</span><h1>¡Hola, '+esc(S.name)+'! Te guardamos un lugar</h1><p class="sub">El <b>28 de octubre</b> abrimos la mesa más dulce del año y los cupos son limitados. ¿Te sentamos con nosotros?</p><div class="row"><button class="opt'+(S.asiste==="Sí"?' sel':'')+'" data-v="Sí" style="flex-direction:column;text-align:center"><span class="e">🙌</span><b>¡Sí, me apunto!</b></button><button class="opt'+(S.asiste==="No"?' sel':'')+'" data-v="No" style="flex-direction:column;text-align:center"><span class="e">🙏</span><b>Esta vez no</b></button></div>'+(S.asiste==="No"?'<div class="nope">Gracias por avisarnos 💗 Los parfaits de esta edición son solo para quienes nos acompañan el <b>28 de octubre</b>. Si tus planes cambian, toca «¡Sí, me apunto!» y la mesa te espera.</div>':'')+'<button class="cta" id="next" '+(S.asiste==="Sí"?'':'disabled')+'>Continuar</button></div>';
    app.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){S.asiste=b.dataset.v;render();toast(S.asiste==="Sí"?"¡Lugar guardado, "+S.name+"! 🎊":"Te vamos a extrañar. Aquí estaremos 💗")}});
    document.getElementById("next").onclick=function(){if(S.asiste==="Sí")go(2)};
  }else if(step===2||step===3){
    var key=step===2?"yogur":"cereal";
    app.innerHTML=levelView(key,false);
    nx=document.getElementById("next");nx.disabled=!S[key];
    app.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){S[key]=b.dataset.v;render()}});
    nx.onclick=function(){toast(DATA[key].badge);go(step+1)};
  }else if(step===4){
    app.innerHTML=levelView("frutas",true);
    nx=document.getElementById("next");
    document.getElementById("cnt").textContent=(S.frutas.length===2?"¡Dúo perfecto! ✨":"Elige 2 frutas · "+S.frutas.length+" de 2");
    nx.disabled=S.frutas.length!==2;
    app.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){
      var v=b.dataset.v,i=S.frutas.indexOf(v);
      if(i>-1)S.frutas.splice(i,1);
      else if(S.frutas.length<2)S.frutas.push(v);
      else{toast("Solo 2 frutas: suelta una para cambiar");return}
      render();
    }});
    nx.onclick=function(){toast(DATA.frutas.badge);go(5)};
  }else{
    app.innerHTML='<div class="scene"><span class="emoji">✨</span><h1>Tu parfait, tu creación</h1><p class="sub">'+esc(S.name)+', mira lo que acabas de crear: tres capas hechas a tu medida y ninguna otra igual. Ya es tuyo. 🍓</p><div class="sum"><div><em>🥛</em><span><small>Tu base cremosa</small><b>'+esc(S.yogur)+'</b></span></div><div><em>🥣</em><span><small>Tu crunch dorado</small><b>'+esc(S.cereal)+'</b></span></div><div><em>🍓</em><span><small>Tu frescura frutal</small><b>'+esc(S.frutas.join(" y "))+'</b></span></div></div><div class="badges">🏅🥇🍓</div><button class="cta" id="send">Enviar mi pedido</button><button class="cta ghost" id="copy">Copiar mi pedido</button><p class="note">Lo armamos fresco, solo para ti. Tu pedido llega directo a nuestra cocina. 💌</p></div>';
    document.getElementById("send").onclick=async function(){
      var b=this;b.disabled=true;b.textContent="Enviando…";
      try{
        var r=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:S.name,asiste:S.asiste,yogur:S.yogur,cereal:S.cereal,frutas:S.frutas})});
        if(!r.ok)throw new Error("fail");
        done();
      }catch(e){b.disabled=false;b.textContent="Enviar mi pedido";toast("No pudimos enviarlo. Intenta de nuevo 🙏")}
    };
    document.getElementById("copy").onclick=function(){
      try{navigator.clipboard.writeText(msg()).then(function(){toast("Pedido copiado ✅")},function(){toast("No se pudo copiar")})}catch(e){toast("No se pudo copiar")}
    };
  }
}
function done(){
  document.getElementById("back").style.visibility="hidden";
  app.innerHTML='<div class="scene" style="text-align:center"><span class="emoji">🎉</span><h1>¡Tu parfait va a la cocina, '+esc(S.name)+'!</h1><p class="sub">Pairfaits ya lo tiene en sus manos y se nos hace agua la boca. '+(S.asiste==="Sí"?"Nos vemos el 28 de octubre. ":"")+'💖</p><div class="badges">🏅🥇🍓</div></div>';
  window.scrollTo({top:0,behavior:"smooth"});
}
document.getElementById("back").onclick=function(){if(step>0)go(step-1)};
render();
</script>
</body>
</html>
